<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillSwap - Active Swaps</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">


    <!-- HEADER -->

    <div class="card flex-header">

        <div>

            <h2>
                Active Skill Swaps
            </h2>

            <p>
                Manage your accepted
                skill exchanges.
            </p>

        </div>


        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>


    <!-- NAV -->

    <div class="nav">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="skills.html">
            My Skills
        </a>

        <a href="matches.html">
            Find Matches
        </a>

        <a href="requests.html">
            Swap Requests
        </a>

        <a href="swaps.html">
            Active Swaps
        </a>

    </div>


    <!-- SWAPS -->

    <div class="card">

        <h2>
            Your Active Swaps
        </h2>


        <button
            class="action-btn"
            onclick="loadSwaps()">

            Refresh Swaps

        </button>


        <div id="swaps">

            Loading swaps...

        </div>

    </div>


</div>


<script src="js/swaps.js"></script>

</body>
</html>
