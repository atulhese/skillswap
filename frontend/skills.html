<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillSwap - My Skills</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">


    <!-- HEADER -->

    <div class="card flex-header">

        <div>

            <h2>
                My Skills
            </h2>

            <p>
                Configure your teaching
                and learning goals.
            </p>

        </div>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>


    <!-- NAV -->

    <div class="nav">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="skills.html">
            My Skills
        </a>

        <a href="matches.html">
            Find Matches
        </a>

        <a href="requests.html">
            Swap Requests
        </a>

        <a href="swaps.html">
            Active Swaps
        </a>

    </div>


    <!-- SKILL FORM -->

    <div class="card">

        <h2>
            Configure Your Skills
        </h2>

        <p>
            Add skills you can teach
            and skills you want to learn.
        </p>


        <label>
            Select Skill
        </label>

        <select id="skillSelect">

            <option value="">
                -- Choose a Skill --
            </option>

        </select>


        <label>
            Goal Type
        </label>

        <select id="skillType">

            <option value="">
                -- Choose Goal Type --
            </option>

            <option value="OFFER">
                I Can Teach (Offer)
            </option>

            <option value="WANT">
                I Want To Learn (Want)
            </option>

        </select>


        <button
            class="action-btn"
            onclick="addSkill()">

            Add Skill

        </button>

    </div>


    <!-- MY SKILLS -->

    <div class="card">

        <h2>
            My Profile Skills
        </h2>

        <div id="mySkills">

            Loading...

        </div>

    </div>


</div>


<script src="js/skills.js"></script>

</body>
</html>
